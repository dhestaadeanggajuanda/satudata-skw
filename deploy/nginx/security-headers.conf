# Header keamanan Satu Data Kota Singkawang.
# Dipakai lewat:  include /etc/nginx/snippets/satudata-security-headers.conf;
# di dalam blok server { } (lihat satudata.conf).
#
# CSP — kenapa tiap sumber ada:
#   data.singkawangkota.go.id          CKAN: gambar infografis & unduhan resource
#   mediacenter.singkawangkota.go.id   Berita: browser memanggil /wp-json (connect-src)
#                                      dan memuat gambar utama berita (img-src)
#   'unsafe-inline' (script/style)     dibutuhkan Next.js pages router (__NEXT_DATA__)
#                                      dan skrip anti-flicker tema di _document.tsx
#   frame-src                          hanya untuk widget Agent Satu Data; ganti
#                                      AGENT_HOST, atau hapus baris tersebut dan pakai
#                                      "frame-src 'none'" bila widget tidak dipakai
#
# Bila memakai fitur query DuckDB-WASM, tambahkan:
#   script-src ... 'wasm-unsafe-eval';  worker-src 'self' blob:;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://data.singkawangkota.go.id https://mediacenter.singkawangkota.go.id; font-src 'self' data:; connect-src 'self' https://data.singkawangkota.go.id https://mediacenter.singkawangkota.go.id; frame-src https://AGENT_HOST; worker-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
