# nginx di depan container Next.js (docker-compose: port 3000).
#
# Pasang:
#   cp deploy/nginx/security-headers.conf /etc/nginx/snippets/satudata-security-headers.conf
#   cp deploy/nginx/satudata.conf         /etc/nginx/conf.d/satudata.conf
#   # ganti AGENT_HOST di snippet, lalu:
#   nginx -t && systemctl reload nginx

upstream satudata_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name satudata.singkawangkota.go.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name satudata.singkawangkota.go.id;

    ssl_certificate     /etc/ssl/satudata/fullchain.pem;
    ssl_certificate_key /etc/ssl/satudata/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Header keamanan (CSP, HSTS, dll). Next.js juga mengirim beberapa header yang
    # sama; buang versi upstream supaya tidak dobel.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    include /etc/nginx/snippets/satudata-security-headers.conf;

    # Aset statis ber-hash: cache panjang.
    # PENTING: add_header di dalam location menimpa header level server, jadi
    # snippet keamanan harus di-include ulang di sini.
    location /_next/static/ {
        proxy_pass http://satudata_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/satudata-security-headers.conf;
    }

    # Proxy resource CKAN — batasi laju untuk mengurangi penyalahgunaan.
    location /api/resource {
        limit_req zone=satudata_api burst=20 nodelay;
        proxy_pass http://satudata_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://satudata_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Taruh di konteks http { } (atau file conf.d terpisah di luar server):
limit_req_zone $binary_remote_addr zone=satudata_api:10m rate=10r/s;
